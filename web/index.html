<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Odds Screen</title>
  <meta name="description" content="Odds screen, +EV finder, middles and parlay builder for NFL, NBA and NCAAB. Runs on your device.">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Odds Screen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://a.espncdn.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // set theme before first paint to avoid a flash
    try {
      const t = localStorage.getItem("oddscreen-theme");
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    } catch { document.documentElement.dataset.theme = "dark"; }
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--pos)"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="url(#bg)"/><path d="M7.5 15.5l3-3.5 2.5 2 3.5-4.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Odds Screen</span>
    </div>
    <nav id="sports" class="sport-switch" aria-label="Sport"></nav>
    <div class="header-right">
      <div class="credits" id="credits" title="">
        <div class="credits-top"><span>Credits</span><b id="credits-num">–</b></div>
        <div class="meter"><i id="credits-bar"></i></div>
      </div>
      <button id="refresh-main" class="btn btn-primary"></button>
      <button id="refresh-props" class="btn btn-secondary"></button>
      <button id="theme" class="icon-btn hide-mobile" title="Toggle light/dark" aria-label="Toggle theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" data-tab="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="subheader">
    <nav class="tabs" id="tabs">
      <button data-tab="ev"><svg viewBox="0 0 24 24"><path d="M4 17l5-5 4 4 7-8" /><path d="M15 8h5v5"/></svg><span>Positive EV</span><span class="count" data-count="ev"></span></button>
      <button data-tab="screen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg><span>Odds Screen</span></button>
      <button data-tab="parlays"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Parlays</span><span class="count accent" data-count="parlays"></span></button>
      <button data-tab="middles"><svg viewBox="0 0 24 24"><path d="M4 7h7M13 17h7M11 7l2 10"/><circle cx="12" cy="12" r="2.2"/></svg><span>Middles</span><span class="count" data-count="middles"></span></button>
      <button data-tab="lowhold"><svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-7"/></svg><span>Low Hold</span></button>
    </nav>
    <div id="freshness" class="freshness"></div>
  </div>

  <section class="toolbar">
    <div class="toolbar-row">
      <button id="filters-toggle" class="btn btn-ghost show-mobile" aria-label="Show filters">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters
      </button>
      <div class="toolbar-group">
        <div class="popover-wrap">
          <button id="books-btn" class="btn btn-ghost"></button>
          <div id="books-pop" class="popover" hidden></div>
        </div>
        <div class="seg" id="fmt">
          <button data-fmt="american">US</button><button data-fmt="decimal">Dec</button>
        </div>
      </div>
    </div>
    <div id="tab-controls" class="toolbar-group controls"></div>
  </section>

  <main id="content"></main>

  <button id="slip-fab" class="slip-fab" aria-label="Open parlay slip">
    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 4h14v16l-3.5-2-3.5 2-3.5-2L5 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    Parlay <span id="slip-count">0</span>
  </button>
  <div id="slip-scrim" class="scrim"></div>
  <aside id="slip" class="slip" aria-label="Parlay slip">
    <div class="sheet-grip"></div>
    <div class="slip-head">
      <h3>Parlay slip</h3>
      <div><button class="btn btn-sm btn-ghost" id="slip-clear">Clear</button><button class="icon-btn" id="slip-close" aria-label="Close">✕</button></div>
    </div>
    <div id="slip-body" class="slip-body"></div>
  </aside>

  <dialog id="modal">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="icon-btn" id="modal-close" aria-label="Close">✕</button></div>
    <div id="modal-body"></div>
  </dialog>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      // a new version took over: reload once so the page runs the new files
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
        .then((reg) => reg.update())
        .catch((e) => console.warn("service worker", e));
    }
  </script>
</body>
</html>
